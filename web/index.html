<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BreezeBlue 注册面板</title>
<style>
  :root{
    --bg:#0a0c11; --panel:#12151c; --panel2:#181c25; --line:#222835; --line2:#2d3442;
    --fg:#e9ecf2; --sub:#8b93a5; --faint:#5d6575;
    --accent:#5b8cff; --accent2:#7c5bff;
    --ok:#34d377; --warn:#ffb547; --err:#ff5d5d; --chip:#1b202b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
    radial-gradient(1200px 500px at 80% -10%, rgba(91,140,255,.06), transparent 60%),
    radial-gradient(900px 420px at 10% -10%, rgba(124,91,255,.05), transparent 60%),
    var(--bg);
    color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#262d3a;border-radius:6px;border:2px solid var(--bg)}

  header{display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(18,21,28,.9);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  header .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4c8dff,#7c5bff);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
    box-shadow:0 4px 14px rgba(91,140,255,.35)}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sp{flex:1}
  .tag{font-size:12px;padding:4px 11px;border-radius:20px;background:var(--chip);color:var(--sub);
    border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .tag .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .tag.ok{color:var(--ok);border-color:#1d4a33}.tag.ok .dot{background:var(--ok);box-shadow:0 0 6px rgba(52,211,119,.7)}
  .tag.err{color:var(--err);border-color:#4a2224}.tag.err .dot{background:var(--err)}
  .tag.warn{color:var(--warn);border-color:#4a3a1d}.tag.warn .dot{background:var(--warn)}
  .tag.sp{color:#8fd0ff;border-color:#264a72}.tag.sp .dot{background:#5b9dff}

  nav{display:flex;gap:6px;padding:10px 22px 0;background:rgba(18,21,28,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:49}
  nav button{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--sub);
    padding:9px 16px;border-radius:10px 10px 0 0;cursor:pointer;font-size:13px;font-weight:500}
  nav button:hover{color:var(--fg)}
  nav button.active{background:var(--bg);border-color:var(--line);color:var(--fg)}

  main{padding:20px 22px 90px;max-width:1560px;margin:0 auto;transition:padding .18s}
  section{display:none} section.active{display:block}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.012),transparent 40%),var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;
    box-shadow:0 8px 28px rgba(0,0,0,.22)}
  .card h2{font-size:12.5px;margin:0 0 14px;color:var(--sub);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
  .kpi:hover{border-color:var(--line2)}
  .kpi .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .kpi .k{font-size:11.5px;color:var(--sub);margin-top:1px}
  .kpi.v-ok .v{color:var(--ok)} .kpi.v-warn .v{color:var(--warn)} .kpi.v-err .v{color:var(--err)}

  label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:4px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:8px 11px;font-size:13px}
  input:focus{outline:none;border-color:#3f66c4;box-shadow:0 0 0 3px rgba(91,140,255,.12)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:120px}

  button.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:9px;
    padding:9px 18px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(91,140,255,.25)}
  button.btn:hover{filter:brightness(1.12)} button.btn:active{transform:translateY(1px)}
  button.btn.big{font-size:14.5px;padding:11px 26px;border-radius:11px}
  button.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg);box-shadow:none;font-weight:500}
  button.btn.ghost:hover{background:#1e2430;border-color:var(--line2)}
  button.btn.danger{background:linear-gradient(135deg,#d45454,#b3403c);box-shadow:0 4px 14px rgba(212,84,84,.22)}
  button.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--sub);border-radius:8px;
    padding:5px 10px;cursor:pointer;font-size:12px;margin-right:6px}
  .iconbtn:hover{color:var(--fg);border-color:#3d4657;background:#202634}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--faint);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;
    position:sticky;top:0;background:var(--panel);z-index:2}
  tr.rowa:hover td{background:rgba(91,140,255,.045)}
  td.mono,th.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
  .pill{padding:3px 10px;border-radius:9px;font-size:11px;border:1px solid var(--line);color:var(--sub)}
  .pill.ok{color:var(--ok);border-color:#1d4a33;background:rgba(52,211,119,.08)}
  .pill.err{color:var(--err);border-color:#4a2224;background:rgba(255,93,93,.07)}
  .pill.warn{color:var(--warn);border-color:#4a3a1d;background:rgba(255,181,71,.07)}
  .num{font-variant-numeric:tabular-nums}
  .credit{font-weight:600;color:var(--warn)}
  .bar{height:10px;background:#1a1f29;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4c8dff,#7c5bff);transition:width .4s}
  .hint{font-size:11.5px;color:var(--faint)}
  .msg{font-size:12px;color:var(--sub)}
  .empty{padding:26px;text-align:center;color:var(--faint)}

  #toasts{position:fixed;right:20px;bottom:56px;z-index:200;display:flex;flex-direction:column;gap:8px}
  .toast{min-width:240px;max-width:420px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;
    padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toast.ok{border-color:#1d4a33}.toast.err{border-color:#4a2224}

  #logbar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:rgba(16,19,26,.97);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);transition:height .18s ease;overflow:hidden;height:38px}
  #logbar-head{display:flex;align-items:center;gap:10px;padding:8px 20px;cursor:pointer;font-size:12.5px;color:var(--sub)}
  #logbar-head:hover{color:var(--fg)}
  #logbar-head .sp{flex:1}
  #logbody{height:0;overflow:auto;padding:0 14px;font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap}
  body.logopen #logbar{height:300px}
  body.logopen #logbody{height:250px;padding:6px 14px 12px}
  body.logopen main{padding-bottom:330px!important}
  .logline .t{color:#5d6575;margin-right:8px}
</style>
</head>
<body>
<header>
  <div class="logo">BB</div>
  <h1>BreezeBlue 注册面板</h1>
  <span class="tag" id="tg-job"><i class="dot"></i>idle</span>
  <span class="tag" id="tg-acc"><i class="dot"></i>账号 0</span>
  <span class="tag warn" id="tg-credit"><i class="dot"></i>积分 0</span>
  <span class="tag" id="tg-claim"><i class="dot"></i>可领 0</span>
  <span class="tag err" id="tg-dead"><i class="dot"></i>死箱 0</span>
  <span class="sp"></span>
  <button class="btn ghost" onclick="loadAll(true)">刷新</button>
</header>

<nav>
  <button class="active" data-tab="run">注册</button>
  <button data-tab="accounts">账号</button>
  <button data-tab="logs">日志</button>
  <button data-tab="inventory">库存</button>
</nav>

<main>
  <section id="tab-run" class="active">
    <div class="card">
      <h2>本次任务</h2>
      <div class="grid g4">
        <div class="kpi"><div class="v" id="k-done">0</div><div class="k">已完成 / 目标 <span id="k-target">0</span></div></div>
        <div class="kpi v-warn"><div class="v" id="k-credit">-</div><div class="k">账号积分合计</div></div>
        <div class="kpi v-ok"><div class="v" id="k-live">0</div><div class="k">验活正常账号</div></div>
        <div class="kpi"><div class="v" id="k-box">-</div><div class="k">当前邮箱</div></div>
      </div>
      <div class="bar" style="margin-top:14px"><i id="kbar"></i></div>
      <div class="row" style="margin-top:8px">
        <span class="msg" id="k-stage">空闲</span>
        <span class="sp" style="flex:1"></span>
        <span class="hint" id="k-time"></span>
      </div>
    </div>

    <div class="card">
      <h2>参数</h2>
      <div class="row">
        <div><label>要跑几个号</label><input id="f-count" value="5"></div>
        <div><label>邀请码</label><input id="f-invite" placeholder="留空用环境变量 INVITE_CODE"></div>
        <div><label>固定密码（可空）</label><input id="f-password" placeholder="留空=随机"></div>
        <div><label>换箱上限</label><input id="f-box" value="8"></div>
        <div><label>换出口上限</label><input id="f-exit" value="3"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div style="flex:3"><label>出口列表（逗号分隔）</label>
          <input id="f-proxies" placeholder="http://127.0.0.1:7891,http://127.0.0.1:7892"></div>
        <div style="flex:0 0 auto"><button class="btn big" id="btn-start">开始注册</button></div>
        <div style="flex:0 0 auto"><button class="btn ghost" id="btn-stop" disabled>停止</button></div>
      </div>
    </div>
  </section>

  <section id="tab-accounts">
    <div class="card">
      <div class="grid g4">
        <div class="kpi"><div class="v" id="a-count">0</div><div class="k">账号总数</div></div>
        <div class="kpi v-warn"><div class="v" id="a-credit">-</div><div class="k">积分合计</div></div>
        <div class="kpi v-ok"><div class="v" id="a-claim">0</div><div class="k">今日可领额度</div></div>
        <div class="kpi"><div class="v" id="a-avg">-</div><div class="k">人均积分</div></div>
      </div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <div style="flex:1"><label>搜索</label><input id="q" placeholder="邮箱 / public_id / 邀请码"></div>
        <div style="flex:0 0 auto"><button class="btn ghost" id="btn-credits">刷新全部积分</button></div>
        <div style="flex:0 0 auto"><a href="/api/export?fmt=csv"><button class="btn ghost">导出 CSV</button></a></div>
        <div style="flex:0 0 auto"><a href="/api/export?fmt=json"><button class="btn ghost">导出 JSON</button></a></div>
      </div>
      <div style="max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:12px">
        <table>
          <thead><tr>
            <th>邮箱</th><th>密码</th><th>积分</th><th>public_id</th><th>本号邀请码</th>
            <th>绑定</th><th>状态</th><th>时间</th><th>操作</th>
          </tr></thead>
          <tbody id="accBody"><tr><td colspan="9" class="empty">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="tab-logs">
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <div style="flex:1"><span class="msg">实时日志 · seq <b id="seq">0</b></span></div>
        <div style="flex:0 0 auto"><button class="btn ghost" id="btn-clear">清屏</button></div>
      </div>
      <div id="logfull" style="background:#07090c;border:1px solid var(--line);border-radius:12px;height:66vh;
        overflow:auto;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap"></div>
    </div>
  </section>

  <section id="tab-inventory">
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <div style="flex:0 0 auto"><button class="btn" id="btn-inv">拉取库存</button></div>
        <div style="flex:0 0 120px"><label>探活前 N 个</label><input id="inv-check" value="0"></div>
        <div style="flex:1"><span class="hint">库存来自 MailNest 已购独占箱（having/holding）；探活会调 receive，慢。</span></div>
      </div>
      <div style="max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:12px">
        <table><thead><tr><th>邮箱</th><th>状态</th></tr></thead>
        <tbody id="invBody"><tr><td colspan="2" class="empty">未拉取</td></tr></tbody></table>
      </div>
    </div>
  </section>
</main>

<div id="logbar">
  <div id="logbar-head" onclick="document.body.classList.toggle('logopen')">
    <span>▸ 运行日志</span>
    <span class="tag" id="logdot"><i class="dot"></i>live</span>
    <span class="sp" style="flex:1"></span>
    <span class="hint" id="loglast"></span>
  </div>
  <div id="logbody"></div>
</div>

<div id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
let seq = 0, accounts = [], lastJob = {};

function toast(msg, kind) {
  const d = document.createElement("div");
  d.className = "toast " + (kind || "");
  d.textContent = msg;
  $("#toasts").appendChild(d);
  setTimeout(() => d.remove(), 2600);
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body || {}) });
  return r.json();
}
function fmt(n, d) { return (n === null || n === undefined) ? "-" : (typeof n === "number" ? n.toFixed(d === undefined ? 0 : d) : n); }

function renderTags(st) {
  const j = st.job || {}, s = st.stats || {};
  const running = !!j.running;
  $("#tg-job").className = "tag " + (running ? "ok" : "");
  $("#tg-job").innerHTML = '<i class="dot"></i>' + (running ? "运行中" : (j.finished_at ? "已结束" : "空闲"));
  $("#tg-acc").innerHTML = '<i class="dot"></i>账号 ' + (s.accounts || 0);
  $("#tg-credit").innerHTML = '<i class="dot"></i>积分 ' + fmt(s.credits_total, 1);
  $("#tg-claim").className = "tag " + (s.claimable ? "ok" : "");
  $("#tg-claim").innerHTML = '<i class="dot"></i>可领 ' + (s.claimable || 0);
  $("#tg-dead").className = "tag " + (s.dead_boxes ? "err" : "");
  $("#tg-dead").innerHTML = '<i class="dot"></i>死箱 ' + (s.dead_boxes || 0);

  $("#k-done").textContent = j.done || 0;
  $("#k-target").textContent = j.target || 0;
  $("#k-credit").textContent = fmt(s.credits_total, 1);
  $("#k-live").textContent = accounts.filter(a => a.credits_ok).length;
  $("#k-box").textContent = j.current || "-";
  $("#kbar").style.width = (j.target ? Math.min(100, (j.done || 0) / j.target * 100) : 0) + "%";
  $("#k-stage").textContent = running ? ("阶段：" + (j.stage || "-")) : (j.finished_at ? "上次结束 " + j.finished_at : "空闲");
  $("#k-time").textContent = j.started_at ? ("开始 " + j.started_at) : "";
  $("#btn-start").disabled = running;
  $("#btn-stop").disabled = !running;

  $("#a-count").textContent = s.accounts || 0;
  $("#a-credit").textContent = fmt(s.credits_total, 1);
  $("#a-claim").textContent = s.claimable || 0;
  const withCred = accounts.filter(a => typeof a.credits === "number");
  $("#a-avg").textContent = withCred.length ? (withCred.reduce((x, a) => x + a.credits, 0) / withCred.length).toFixed(1) : "-";
}

function renderAccounts() {
  const q = ($("#q").value || "").toLowerCase();
  const rows = accounts.filter(a => !q || [a.email, a.public_id, a.own_code, a.referral]
    .some(v => (v || "").toLowerCase().includes(q)));
  if (!rows.length) { $("#accBody").innerHTML = '<tr><td colspan="9" class="empty">还没有账号</td></tr>'; return; }
  $("#accBody").innerHTML = rows.map(a => {
    const e = a.email || "";
    const credit = typeof a.credits === "number"
      ? '<span class="credit num">' + a.credits.toFixed(0) + '</span>'
      : '<span class="pill">未取</span>';
    const okTag = a.credits_ok ? '<span class="pill ok">正常</span>' : '<span class="pill err">异常</span>';
    const daily = a.daily_available ? ' <span class="pill warn">可领</span>' : "";
    return '<tr class="rowa">' +
      '<td class="mono">' + e + '</td>' +
      '<td class="mono">' + (a.password || "") + '</td>' +
      '<td>' + credit + '</td>' +
      '<td class="mono">' + (a.public_id || "") + '</td>' +
      '<td class="mono">' + (a.own_code || "") + '</td>' +
      '<td><span class="pill">' + (a.referral || "-") + '</span></td>' +
      '<td>' + okTag + daily + '</td>' +
      '<td class="hint">' + (a.at || "") + '</td>' +
      '<td><button class="iconbtn" onclick="checkAcc(\'' + e + '\')">验活</button>' +
      '<button class="iconbtn" onclick="claim(\'' + e + '\')">领额度</button>' +
      '<button class="iconbtn" onclick="relogin(\'' + e + '\')">重登</button>' +
      '<button class="iconbtn" onclick="copyAcc(\'' + e + '\')">复制</button></td></tr>';
  }).join("");
}

async function loadAll(force) {
  const st = await (await fetch("/api/state")).json();
  accounts = st.accounts || [];
  lastJob = st.job || {};
  renderTags(st);
  renderAccounts();
}

async function pullLogs() {
  const j = await (await fetch("/api/logs?after=" + seq)).json();
  if (j.lines && j.lines.length) {
    const bar = $("#logbody"), full = $("#logfull");
    const atBottom = bar.scrollTop + bar.clientHeight >= bar.scrollHeight - 30;
    for (const l of j.lines) {
      const line = '<div class="logline"><span class="t">' + l.ts + '</span>' + l.line.replace(/</g, "&lt;") + '</div>';
      bar.insertAdjacentHTML("beforeend", line);
      if (full) full.insertAdjacentHTML("beforeend", line);
      $("#loglast").textContent = l.line.slice(0, 60);
    }
    while (bar.childElementCount > 2500) bar.removeChild(bar.firstChild);
    while (full && full.childElementCount > 4000) full.removeChild(full.firstChild);
    if (atBottom) bar.scrollTop = bar.scrollHeight;
    if (full) full.scrollTop = full.scrollHeight;
    seq = j.seq;
    $("#seq").textContent = seq;
  }
}

async function checkAcc(email) {
  toast("验活 " + email);
  const r = await post("/api/account/check", { email });
  toast(r.ok ? ("正常 · " + (r.balance ?? "-") + " 积分") : ("异常 " + (r.me_status || r.error || "")), r.ok ? "ok" : "err");
  loadAll();
}
async function claim(email) {
  const r = await post("/api/account/claim", { email });
  toast(r.ok ? "领取成功" : ("领取失败 " + (r.status || "")), r.ok ? "ok" : "err");
  loadAll();
}
async function relogin(email) {
  toast("重登 " + email);
  const r = await post("/api/account/relogin", { email });
  toast(r.ok ? ("已重登 · " + (r.balance ?? "-") + " 积分") : ("重登失败 " + (r.stage || "")), r.ok ? "ok" : "err");
  loadAll();
}
function copyAcc(email) {
  const a = accounts.find(x => x.email === email) || {};
  navigator.clipboard.writeText((a.email || "") + "----" + (a.password || ""));
  toast("已复制 邮箱 + 密码", "ok");
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
  ["run", "accounts", "logs", "inventory"].forEach(t => $("#tab-" + t).classList.toggle("active", t === b.dataset.tab));
});

$("#btn-start").onclick = async () => {
  const body = {
    count: +$("#f-count").value || 1,
    invite: $("#f-invite").value.trim(),
    password: $("#f-password").value.trim(),
    proxies: $("#f-proxies").value.trim(),
    max_box_tries: +$("#f-box").value || 8,
    max_exit_tries: +$("#f-exit").value || 3,
  };
  const r = await post("/api/start", body);
  toast(r.ok ? "已开始" : ("启动失败：" + (r.error || "")), r.ok ? "ok" : "err");
  loadAll();
};
$("#btn-stop").onclick = async () => { await post("/api/stop"); toast("已请求停止"); loadAll(); };
$("#btn-credits").onclick = async () => {
  toast("刷新全部积分…");
  const r = await post("/api/accounts/refresh");
  toast("已刷新 " + (r.refreshed || 0) + " 个", "ok");
  loadAll();
};
$("#btn-clear").onclick = () => { $("#logfull").innerHTML = ""; };
$("#q").oninput = renderAccounts;
$("#btn-inv").onclick = async () => {
  const n = +$("#inv-check").value || 0;
  $("#invBody").innerHTML = '<tr><td colspan="2" class="empty">拉取中…</td></tr>';
  const j = await (await fetch("/api/inventory?limit=300&check=" + n)).json();
  $("#invBody").innerHTML = (j.rows || []).map(r => {
    let s = r.used ? '<span class="pill">已用</span>' : '<span class="pill ok">可用</span>';
    if (r.dead) s = '<span class="pill err">死箱</span>';
    if (r.alive === true) s += ' <span class="pill ok">活</span>';
    if (r.alive === false) s += ' <span class="pill err">不通</span>';
    return '<tr class="rowa"><td class="mono">' + r.email + '</td><td>' + s + '</td></tr>';
  }).join("") || '<tr><td colspan="2" class="empty">空</td></tr>';
};

loadAll();
pullLogs();
setInterval(() => { loadAll(); pullLogs(); }, 3000);
</script>
</body>
</html>
