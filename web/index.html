<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BreezeBlue 注册面板</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --txt:#e6e9ef; --dim:#8b94a7; --acc:#4c8dff; --ok:#3ecf8e; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.55 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.3px; }
  .pill { padding:2px 10px; border-radius:99px; font-size:12px; background:#232838; color:var(--dim); }
  .pill.on { background:rgba(62,207,142,.15); color:var(--ok); }
  .grow { flex:1; }
  .bar { height:8px; background:#20252f; border-radius:99px; overflow:hidden; width:220px; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#2f6fed,#4c8dff); transition:width .4s; }
  main { padding:18px 20px 40px; max-width:1180px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  label { color:var(--dim); font-size:12px; display:block; margin-bottom:4px; }
  input, select { background:#12151c; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px 10px; font-size:13px; }
  input.wide { width:430px; }
  input.small { width:96px; }
  button { background:#222838; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; }
  button:hover { border-color:#3b455c; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.danger { background:#3a2027; border-color:#5a2a33; color:#ffb3b3; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button.active { background:#242c3d; border-color:#3b455c; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  code { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:#b9c4d8; }
  .log { background:#0b0d12; border:1px solid var(--line); border-radius:10px; height:420px; overflow:auto; padding:10px 12px; font-family:ui-monospace,Consolas,monospace; font-size:12px; white-space:pre-wrap; }
  .log .t { color:#5d6a80; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .dim { color:var(--dim); }
  .tag { font-size:11px; padding:1px 7px; border-radius:99px; background:#232838; color:var(--dim); }
  .tag.ok { background:rgba(62,207,142,.15); color:var(--ok); }
  .tag.bad { background:rgba(255,107,107,.14); color:var(--bad); }
  .hidden { display:none; }
  #toast { position:fixed; right:18px; bottom:18px; background:#1d2431; border:1px solid var(--line); padding:10px 14px; border-radius:10px; opacity:0; transition:.25s; font-size:13px; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>BreezeBlue 注册面板</h1>
  <span id="status" class="pill">idle</span>
  <span class="dim" id="progressText">0 / 0</span>
  <div class="bar"><i id="bar"></i></div>
  <span class="grow"></span>
  <span class="dim" id="accCount"></span>
</header>

<main>
  <div class="card">
    <div class="row">
      <div><label>要跑几个号</label><input id="count" class="small" value="5"></div>
      <div><label>邀请码</label><input id="invite" class="small" style="width:130px"></div>
      <div><label>固定密码（可空）</label><input id="password" class="small" style="width:170px" placeholder="留空=随机"></div>
      <div><label>换箱上限</label><input id="maxBox" class="small" value="8"></div>
      <div><label>换出口上限</label><input id="maxExit" class="small" value="3"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label>出口列表（逗号分隔，http://host:port）</label><input id="proxies" class="wide" placeholder="http://127.0.0.1:7891,http://127.0.0.1:7892"></div>
      <button class="primary" id="btnStart">开始</button>
      <button class="danger" id="btnStop" disabled>停止</button>
    </div>
  </div>

  <div class="tabs">
    <button data-tab="accounts" class="active">账号</button>
    <button data-tab="logs">日志</button>
    <button data-tab="inventory">库存</button>
  </div>

  <section id="tab-accounts">
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <button id="btnRefresh">刷新</button>
        <a href="/api/export?fmt=csv"><button>导出 CSV</button></a>
        <a href="/api/export?fmt=json"><button>导出 JSON</button></a>
        <span class="grow"></span>
        <input id="q" placeholder="搜索邮箱 / public_id" style="width:240px">
      </div>
      <table>
        <thead><tr><th>邮箱</th><th>密码</th><th>public_id</th><th>本号邀请码</th><th>绑定邀请码</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="accBody"><tr><td colspan="7" class="dim">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section id="tab-logs" class="hidden">
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <button id="btnClear">清屏</button>
        <span class="dim" id="seqInfo"></span>
      </div>
      <div class="log" id="log"></div>
    </div>
  </section>

  <section id="tab-inventory" class="hidden">
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <button id="btnInv">拉取库存</button>
        <div><label>探活前 N 个</label><input id="checkN" class="small" value="0"></div>
        <span class="dim">（库存来自 MailNest 已购独占箱；探活会调 receive，慢一点）</span>
      </div>
      <table>
        <thead><tr><th>邮箱</th><th>状态</th></tr></thead>
        <tbody id="invBody"><tr><td colspan="2" class="dim">未拉取</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let seq = 0, tab = "accounts", accounts = [], timer = null;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body || {}) });
  return r.json();
}

function renderState(st) {
  const job = st.job || {};
  $("#status").textContent = job.running ? "running" : (job.finished_at ? "finished" : "idle");
  $("#status").className = "pill" + (job.running ? " on" : "");
  const done = job.done || 0, target = job.target || 0;
  $("#progressText").textContent = done + " / " + target + (job.current ? "  ·  " + job.current : "");
  $("#bar").style.width = target ? Math.min(100, done / target * 100) + "%" : "0%";
  $("#accCount").textContent = "账号 " + ((st.stats && st.stats.accounts) || 0) + " · 死箱 " + ((st.stats && st.stats.dead_boxes) || 0);
  $("#btnStart").disabled = !!job.running;
  $("#btnStop").disabled = !job.running;
  $("#invite").placeholder = job.invite || "";
  accounts = st.accounts || [];
  renderAccounts();
}

function renderAccounts() {
  const q = ($("#q").value || "").toLowerCase();
  const rows = accounts.filter(a => !q || (a.email || "").toLowerCase().includes(q) || (a.public_id || "").toLowerCase().includes(q));
  if (!rows.length) { $("#accBody").innerHTML = '<tr><td colspan="7" class="dim">还没有账号</td></tr>'; return; }
  $("#accBody").innerHTML = rows.map(a => {
    const e = a.email || "";
    return '<tr><td><code>' + e + '</code></td><td><code>' + (a.password || "") + '</code></td>' +
      '<td><code>' + (a.public_id || "") + '</code></td>' +
      '<td><code>' + (a.own_code || "") + '</code></td>' +
      '<td><span class="tag ok">' + (a.referral || "-") + '</span></td>' +
      '<td class="dim">' + (a.at || "") + '</td>' +
      '<td><button onclick="checkAcc(\'' + e + '\')">验活</button> ' +
      '<button onclick="claim(\'' + e + '\')">领额度</button> ' +
      '<button onclick="copyAcc(\'' + e + '\')">复制</button></td></tr>';
  }).join("");
}

async function checkAcc(email) {
  toast("验活中 " + email);
  const r = await post("/api/account/check", { email });
  toast(r.ok ? ("正常 · " + (r.credits ?? "-") + " credits") : ("异常 " + (r.me_status || r.error || "")));
}
async function claim(email) {
  const r = await post("/api/account/claim", { email });
  toast(r.ok ? "领取成功" : ("领取失败 " + r.status));
}
function copyAcc(email) {
  const a = accounts.find(x => x.email === email);
  navigator.clipboard.writeText((a.email || "") + "----" + (a.password || ""));
  toast("已复制 邮箱+密码");
}

async function pullLogs() {
  const r = await fetch("/api/logs?after=" + seq);
  const j = await r.json();
  if (j.lines && j.lines.length) {
    const el = $("#log");
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
    for (const l of j.lines) {
      const d = document.createElement("div");
      d.innerHTML = '<span class="t">' + l.ts + '</span>  ' + l.line.replace(/</g, "&lt;");
      el.appendChild(d);
    }
    while (el.childElementCount > 3000) el.removeChild(el.firstChild);
    if (atBottom) el.scrollTop = el.scrollHeight;
    seq = j.seq;
    $("#seqInfo").textContent = "seq " + seq;
  }
}

async function tick() {
  try {
    const st = await (await fetch("/api/state")).json();
    renderState(st);
    await pullLogs();
  } catch (e) {}
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("active", x === b));
  ["accounts", "logs", "inventory"].forEach(t => $("#tab-" + t).classList.toggle("hidden", t !== tab));
});

$("#btnStart").onclick = async () => {
  const body = {
    count: +$("#count").value || 1,
    invite: $("#invite").value.trim(),
    password: $("#password").value.trim(),
    proxies: $("#proxies").value.trim(),
    max_box_tries: +$("#maxBox").value || 8,
    max_exit_tries: +$("#maxExit").value || 3,
  };
  const r = await post("/api/start", body);
  toast(r.ok ? "已开始" : ("启动失败：" + r.error));
};
$("#btnStop").onclick = async () => { await post("/api/stop"); toast("已请求停止"); };
$("#btnRefresh").onclick = tick;
$("#q").oninput = renderAccounts;
$("#btnClear").onclick = () => { $("#log").innerHTML = ""; };
$("#btnInv").onclick = async () => {
  const n = +$("#checkN").value || 0;
  $("#invBody").innerHTML = '<tr><td colspan="2" class="dim">拉取中…</td></tr>';
  const j = await (await fetch("/api/inventory?limit=200&check=" + n)).json();
  $("#invBody").innerHTML = (j.rows || []).map(r => {
    let s = r.used ? '<span class="tag">已用</span>' : '<span class="tag ok">可用</span>';
    if (r.dead) s = '<span class="tag bad">死箱</span>';
    if (r.alive === true) s += ' <span class="tag ok">活</span>';
    if (r.alive === false) s += ' <span class="tag bad">不通</span>';
    return '<tr><td><code>' + r.email + '</code></td><td>' + s + '</td></tr>';
  }).join("") || '<tr><td colspan="2" class="dim">空</td></tr>';
};

timer = setInterval(tick, 2000);
tick();
</script>
</body>
</html>
